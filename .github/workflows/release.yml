# Publish to npm when a v* tag is pushed.
#
# The whole release is one command locally:
#
#     npm version minor && git push --follow-tags
#
# `npm version` writes package.json, commits it and creates the tag, so the tag
# and the version cannot disagree — but a hand-made tag can, and publishing
# 0.4.3 as v0.5.0 is the kind of mistake nobody notices for weeks. The job
# refuses that outright rather than trusting the habit.
#
# Tests run here before publishing, deliberately narrow: lint and the suites
# that need no credentials. The Storacha-backed suites live in ci.yml and want
# secrets a tag push should not have to carry.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # The check that earns this file's existence.
      - name: The tag must be the version in package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG — nothing published"
            exit 1
          fi
          echo "publishing $PKG"

      - name: Run ESLint
        run: npm run lint

      # Credential-free suites only. courier-sync is the one downstream
      # projects depend on, and it never ran in CI at all before this.
      - name: Run the tests that need no secrets
        run: npx jest test/courier-sync.test.js test/car-storage.test.js --forceExit
        env:
          NODE_OPTIONS: "--experimental-vm-modules --no-warnings"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
